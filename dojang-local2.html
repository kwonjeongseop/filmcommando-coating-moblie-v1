<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>도장 한 번 — 서류 도장 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
    background: #e8eaef;
    background-image: radial-gradient(circle at 50% 0%, #eef0f5, #dee1e8);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; color: #14233F;
    -webkit-font-smoothing: antialiased;
  }
  #root { display: flex; }
  .stage { display: flex; }
  .app-root { position: relative; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }

  .device-fill { position: relative; height: 100%; overflow: hidden; background: var(--surface); }

  /* ───────── shared buttons ───────── */
  .btn { border-radius: 12px; font-size: 15px; font-weight: 700; padding: 12px 18px; letter-spacing: -0.01em; transition: .15s; }
  .btn.solid { background: var(--primary); color: #fff; }
  .btn.solid:hover { background: var(--primary-dark); }
  .btn.solid:disabled { background: #c7cfdd; cursor: default; }
  .btn.ghost { background: #eef1f6; color: var(--navy); }
  .btn.ghost:hover { background: #e4e8f0; }
  .btn.wide { width: 100%; }
  .btn.sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
  .iconbtn { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--navy); transition: .15s; }
  .iconbtn:hover { background: rgba(20,35,63,.06); }
  .iconbtn.sm { width: 34px; height: 34px; }

  /* ───────── capture screen ───────── */
  .capture { height: 100%; overflow-y: auto; padding: 14px 22px 30px; display: flex; flex-direction: column; }
  .cap-brand { display: flex; align-items: center; gap: 12px; margin: 6px 0 22px; }
  .cap-logo { width: 46px; height: 46px; border-radius: 14px; background: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -4px var(--primary); }
  .cap-app { font-size: 20px; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
  .cap-tag { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-top: 1px; }

  .cap-hero { display: flex; justify-content: center; padding: 6px 0 10px; }
  .cap-hero-doc { position: relative; width: 168px; height: 214px; background: #fff; border-radius: 10px; box-shadow: 0 18px 40px -14px rgba(20,35,63,.32), 0 2px 0 #fff; padding: 26px 20px; display: flex; flex-direction: column; gap: 11px; transform: rotate(-3deg); border: 1px solid #eef1f6; }
  .chd-line { height: 7px; border-radius: 4px; background: #e7ebf2; }
  .chd-line.w40 { width: 40%; } .chd-line.w50 { width: 50%; } .chd-line.w70 { width: 70%; } .chd-line.w80 { width: 80%; } .chd-line.w90 { width: 90%; }
  .chd-seal { position: absolute; right: 14px; bottom: 14px; transform: rotate(8deg); opacity: .92; }

  .cap-headline { font-size: 23px; font-weight: 800; color: var(--navy); letter-spacing: -0.03em; margin-top: 14px; text-align: center; }
  .cap-desc { font-size: 13.5px; line-height: 1.6; color: var(--muted); text-align: center; margin: 8px 0 22px; font-weight: 500; }

  .cap-actions { display: flex; flex-direction: column; gap: 10px; }
  .cap-btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; font-size: 16px; font-weight: 700; background: #fff; color: var(--navy); border: 1.5px solid var(--line); transition: .15s; }
  .cap-btn:hover { border-color: #cfd6e3; }
  .cap-btn.primary { background: var(--primary); color: #fff; border: none; box-shadow: 0 10px 22px -8px var(--primary); }
  .cap-btn.primary:hover { background: var(--primary-dark); }

  .cap-recent { margin-top: 26px; }
  .cap-recent-h { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; letter-spacing: -0.01em; }
  .recent-row { width: 100%; display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; transition: .15s; }
  .recent-row:hover { border-color: #cfd6e3; }
  .recent-thumb { width: 38px; height: 38px; border-radius: 9px; background: color-mix(in srgb, var(--primary) 10%, #fff); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .recent-meta { flex: 1; text-align: left; }
  .recent-meta b { display: block; font-size: 14.5px; color: var(--navy); font-weight: 700; }
  .recent-meta i { font-size: 12px; color: var(--muted); font-style: normal; }

  /* ───────── editor chrome ───────── */
  .editor { height: 100%; display: flex; flex-direction: column; background: var(--surface); }
  .appbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: #fff; border-bottom: 1px solid var(--line); }
  .appbar-title { flex: 1; min-width: 0; }
  .apptitle { display: block; font-size: 16.5px; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appsub { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 1px; }

  .toolstrip { display: flex; align-items: stretch; gap: 2px; padding: 7px 8px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .toolstrip::-webkit-scrollbar { display: none; }
  .tool-div { width: 1px; background: var(--line); margin: 6px 4px; flex-shrink: 0; }
  .toolbtn { flex: 1 0 auto; min-width: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 4px; border-radius: 11px; color: var(--navy); transition: .15s; }
  .toolbtn:hover { background: rgba(20,35,63,.05); }
  .toolbtn.active { background: color-mix(in srgb, var(--primary) 12%, #fff); color: var(--primary-dark); }
  .toolbtn:disabled { color: #b9c1d0; cursor: default; }
  .toolbtn:disabled:hover { background: none; }
  .toolbtn-label { font-size: 10.5px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
  .toolbtn.primary { background: var(--primary); color: #fff; box-shadow: 0 5px 12px -5px var(--primary); }
  .toolbtn.primary:hover { background: var(--primary-dark); }
  .toolbtn.primary .toolbtn-label { font-weight: 700; }

  .zoombar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--line); }
  .zoombar input[type=range] { flex: 1; accent-color: var(--primary); }
  .zoombar .iconbtn { color: var(--navy); }
  .zoom-val { font-size: 12.5px; font-weight: 700; color: var(--muted); min-width: 40px; text-align: center; }

  .place-banner { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--navy); color: #fff; }
  .pb-art { width: 30px; height: 30px; border-radius: 7px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .pb-text { flex: 1; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .place-banner .btn.solid { background: #fff; color: var(--navy); }

  /* ───────── canvas + page ───────── */
  .canvas { flex: 1; overflow: auto; background: #dfe3ea; background-image: radial-gradient(circle, #d2d7e0 1px, transparent 1px); background-size: 18px 18px; }
  .page-wrap { min-width: 100%; min-height: 100%; box-sizing: border-box; padding: 18px; display: flex; align-items: flex-start; justify-content: center; }
  .page-wrap.placing .page { cursor: none; }
  .page { position: relative; background: #fff; box-shadow: 0 12px 34px -10px rgba(20,35,63,.34); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .doc-img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }

  .placed { position: absolute; transform-origin: center; touch-action: none; }
  .placed.sel { outline: 1.6px dashed var(--primary); outline-offset: 5px; cursor: move; border-radius: 2px; }
  .placed > * { pointer-events: none; }
  .placed.sel { z-index: 5; }
  .h-del, .h-rot, .h-res { position: absolute; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; color: var(--navy); box-shadow: 0 2px 6px rgba(20,35,63,.3); cursor: pointer; z-index: 6; }
  .placed > .h-del, .placed > .h-rot, .placed > .h-res { pointer-events: auto; }
  .h-del { top: -14px; right: -14px; color: #E2453C; }
  .h-rot { top: -14px; left: -14px; cursor: grab; }
  .h-res { bottom: -14px; right: -14px; cursor: nwse-resize; }
  .stamp-ghost { position: absolute; transform: translate(-50%,-50%); opacity: .55; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.18)); }

  /* ───────── sheets / dialogs ───────── */
  .sheet-scrim { position: absolute; inset: 0; background: rgba(15,22,38,.42); display: flex; align-items: flex-end; justify-content: center; z-index: 40; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { width: 100%; background: #fff; border-radius: 22px 22px 0 0; padding: 6px 18px 22px; max-height: 84%; display: flex; flex-direction: column; animation: slideup .26s cubic-bezier(.2,.9,.3,1); }
  .dialog { width: calc(100% - 40px); background: #fff; border-radius: 20px; padding: 6px 18px 20px; margin: auto; align-self: center; animation: pop .22s cubic-bezier(.2,.9,.3,1); }
  .sheet-scrim:has(.dialog) { align-items: center; }
  @keyframes slideup { from { transform: translateY(100%); } }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
  .sheet-title { font-size: 17px; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
  .sheet-body { overflow-y: auto; }
  .sheet-foot { padding-top: 12px; }
  .sheet-hint { font-size: 13px; color: var(--muted); margin-bottom: 14px; font-weight: 500; line-height: 1.5; }
  .sheet-hint b { color: var(--navy); }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-actions .btn { flex: 1; }

  .stamp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stamp-card { position: relative; aspect-ratio: 1 / 1.1; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; transition: .15s; }
  .stamp-card:hover { border-color: #cfd6e3; }
  .stamp-card.sel { border-color: var(--primary); border-width: 2px; background: color-mix(in srgb, var(--primary) 5%, #fff); }
  .stamp-card-art { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; overflow: hidden; }
  .stamp-card-label { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .stamp-card-tick { position: absolute; top: 7px; right: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; }
  .stamp-card.add { border-style: dashed; color: var(--primary); }
  .stamp-card.add .stamp-card-label { color: var(--primary); }

  .seg { display: flex; background: #eef1f6; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .seg button { flex: 1; padding: 9px; border-radius: 9px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--navy); box-shadow: 0 1px 4px rgba(20,35,63,.12); }

  .tf { width: 100%; height: 50px; border: 1.5px solid var(--line); border-radius: 13px; padding: 0 16px; font-size: 16px; font-weight: 600; color: var(--navy); background: #fff; outline: none; transition: .15s; }
  .tf:focus { border-color: var(--primary); }
  .add-make { display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .add-make .tf { width: 100%; }
  .seal-preview { height: 116px; display: flex; align-items: center; justify-content: center; }
  .muted { color: #b9c1d0; font-size: 13px; }
  .add-up { display: flex; flex-direction: column; gap: 12px; }
  .upload-tile { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 30px 16px; border: 1.6px dashed var(--line); border-radius: 16px; background: #fafbfd; color: var(--navy); font-size: 13.5px; font-weight: 600; text-align: center; transition: .15s; }
  .upload-tile:hover { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 4%, #fff); }

  .share-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 8px; padding: 6px 0; }
  .share-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .share-ic { width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px -6px rgba(20,35,63,.3); transition: .15s; }
  .share-item:hover .share-ic { transform: translateY(-2px); }
  .share-label { font-size: 12px; font-weight: 600; color: var(--navy); }

  .menu-scrim { position: absolute; inset: 0; z-index: 45; }
  .menu { position: absolute; top: 54px; right: 10px; background: #fff; border-radius: 14px; box-shadow: 0 12px 34px -8px rgba(20,35,63,.34); padding: 6px; min-width: 200px; animation: pop .16s ease; }
  .menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 14.5px; font-weight: 600; color: var(--navy); text-align: left; }
  .menu button:hover { background: #f3f5f9; }

  /* ───────── preview modal ───────── */
  .preview-modal { position: absolute; inset: 0; z-index: 50; background: #20283a; display: flex; flex-direction: column; animation: fade .2s ease; }
  .preview-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 10px 16px; color: #fff; }
  .preview-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .preview-top .iconbtn { color: #fff; }
  .preview-top .iconbtn:hover { background: rgba(255,255,255,.12); }
  .preview-scroll { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 12px 16px; }
  .preview-page { box-shadow: 0 18px 50px -10px rgba(0,0,0,.5); }
  .preview-foot { text-align: center; color: #aab3c6; font-size: 12px; padding: 12px; font-weight: 500; }

  /* ───────── toast ───────── */
  .toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 30px -8px rgba(0,0,0,.4); z-index: 60; white-space: nowrap; animation: toastin .26s cubic-bezier(.2,.9,.3,1); }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px); } }

  /* ───────── capture header ───────── */
  .cap-top { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; }
  .cap-brand { display: flex; align-items: center; gap: 12px; margin: 0; }

  /* ───────── sheet detail ───────── */
  .sheet-scrim.center { align-items: center; }
  .sheet-grip { display: block; width: 38px; height: 4px; border-radius: 3px; background: #dde2ea; margin: 8px auto 0; }
  .sheet-sub { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .dialog.sm { padding: 22px 20px 18px; }
  .cf-title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .cf-body { font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 500; margin-bottom: 18px; }
  .btn.danger { background: #E2453C; color: #fff; }
  .btn.danger:hover { background: #c8362e; }

  .pop-search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #f2f4f8; border-radius: 12px; margin-bottom: 12px; }
  .pop-search input { flex: 1; border: none; background: none; outline: none; font-size: 14.5px; font-weight: 600; color: var(--navy); }
  .pop-search input::placeholder { color: #9aa5b8; font-weight: 500; }

  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-bottom: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 8px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: #f2f4f8; color: var(--muted); transition: .15s; }
  .chip.on { background: var(--navy); color: #fff; }

  .pop-block { margin-bottom: 20px; }
  .pop-block-h { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.02em; margin-bottom: 9px; }
  .pop-block-h em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, #fff); padding: 1px 7px; border-radius: 999px; }
  .stamp-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .stamp-row::-webkit-scrollbar { display: none; }
  .stamp-card.small { flex: 0 0 84px; aspect-ratio: 1 / 1.15; }
  .empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 26px 0; border: 1.4px dashed var(--line); border-radius: 14px; font-size: 13px; color: var(--muted); font-weight: 600; }

  .opt-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .opt-l { font-size: 13.5px; font-weight: 600; color: var(--navy); width: 48px; }
  .opt-v { font-size: 12.5px; font-weight: 700; color: var(--muted); width: 42px; text-align: right; }
  .rng { flex: 1; accent-color: var(--primary); height: 4px; }

  .pop-foot { display: flex; align-items: center; gap: 12px; }
  .pop-preview { width: 54px; height: 54px; border-radius: 13px; border: 1.4px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .pop-preview .muted { font-size: 10.5px; }

  .fmt-row { display: flex; gap: 8px; }
  .fmt { flex: 1; border: 1.5px solid var(--line); border-radius: 13px; padding: 11px 8px; display: flex; flex-direction: column; gap: 3px; transition: .15s; }
  .fmt b { font-size: 14px; font-weight: 800; color: var(--navy); }
  .fmt i { font-size: 10.5px; font-style: normal; color: var(--muted); font-weight: 600; }
  .fmt.on { border-color: var(--primary); border-width: 2px; background: color-mix(in srgb, var(--primary) 5%, #fff); }
  .fmt.on b { color: var(--primary-dark); }

  .tog-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; font-size: 14px; font-weight: 600; color: var(--navy); }
  .switch { width: 44px; height: 26px; border-radius: 999px; background: #d6dbe4; padding: 3px; display: flex; transition: .18s; }
  .switch span { width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.22); transition: .18s; }
  .switch.on { background: var(--primary); }
  .switch.on span { transform: translateX(18px); }
  .switch:disabled { opacity: .45; cursor: default; }
  .tf.sm { height: 44px; font-size: 14.5px; margin-top: 8px; }

  .ct-row { display: flex; gap: 14px; }
  .ct { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ct-av { width: 46px; height: 46px; border-radius: 50%; color: #fff; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .ct i { font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--navy); }

  .tips { margin: 4px 0 0 16px; padding: 0; }
  .tips li { font-size: 12.5px; line-height: 1.7; color: var(--muted); font-weight: 500; }

  /* ───────── drawer ───────── */
  .dr-scrim { position: absolute; inset: 0; background: rgba(15,22,38,.42); z-index: 48; animation: fade .18s ease; }
  .drawer { width: 282px; height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: 6px 0 30px -6px rgba(20,35,63,.34); animation: slidein .24s cubic-bezier(.2,.9,.3,1); }
  @keyframes slidein { from { transform: translateX(-100%); } }
  .dr-head { display: flex; align-items: center; gap: 11px; padding: 22px 18px 16px; }
  .dr-logo { width: 42px; height: 42px; border-radius: 13px; background: var(--primary); display: flex; align-items: center; justify-content: center; }
  .dr-app { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
  .dr-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .dr-now { display: flex; align-items: center; gap: 10px; margin: 0 14px 14px; padding: 11px 12px; background: var(--surface); border-radius: 13px; color: var(--primary-dark); }
  .dr-now-t b { display: block; font-size: 13.5px; font-weight: 700; color: var(--navy); }
  .dr-now-t i { font-size: 11px; font-style: normal; color: var(--muted); font-weight: 500; }
  .dr-scroll { flex: 1; overflow-y: auto; padding: 0 10px; }
  .dr-group { margin-bottom: 14px; }
  .dr-group-label { font-size: 10.5px; font-weight: 800; color: #9aa5b8; letter-spacing: .06em; padding: 6px 12px; }
  .dr-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 11px; color: var(--navy); transition: .14s; }
  .dr-item:hover { background: #f3f5f9; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

      <input type="range" className="twk-slider" min={min} max={max} step={step}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">

              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* ───────────────────────── Stamp visuals ───────────────────────── */
function SealVisual({ text, color, size }) {
  const chars = [...(text || '')].slice(0, 4);
  const n = chars.length;
  const cols = n <= 2 ? 1 : 2;
  const rows = Math.ceil(n / cols);
  const ring = Math.max(2.5, size * 0.045);
  const fs = (size * 0.9) / rows * (cols === 1 ? 0.78 : 0.92);
  // traditional right-to-left, top-to-bottom column fill
  const cell = (ch, i) => {
    const col = cols - Math.floor(i / rows);
    const row = (i % rows) + 1;
    return (
      <span key={i} style={{
        gridColumn: col, gridRow: row,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: fs, lineHeight: 1,
      }}>{ch}</span>
    );
  };
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      border: `${ring}px solid ${color}`, boxSizing: 'border-box',
      position: 'relative', color,
      fontFamily: "'Nanum Myeongjo', serif", fontWeight: 800,
      display: 'grid', placeItems: 'center', userSelect: 'none',
      background: 'transparent',
    }}>
      <div style={{
        position: 'absolute', inset: size * 0.085, borderRadius: '50%',
        border: `1.4px solid ${color}`, opacity: 0.85,
      }} />
      <div style={{
        display: 'grid',
        gridTemplateColumns: `repeat(${cols}, 1fr)`,
        gridTemplateRows: `repeat(${rows}, 1fr)`,
        width: size * 0.66, height: size * 0.66,
      }}>
        {chars.map(cell)}
      </div>
    </div>
  );
}

function StampVisual({ stamp, scale = 1 }) {
  if (!stamp) return null;
  if (stamp.kind === 'image') {
    return <img src={stamp.src} alt="" draggable={false}
      style={{ width: (stamp.w || 120) * scale, height: 'auto', display: 'block', pointerEvents: 'none' }} />;
  }
  if (stamp.kind === 'seal') {
    return <SealVisual text={stamp.text} color={stamp.color} size={94 * scale} />;
  }
  if (stamp.kind === 'signature') {
    return <div style={{
      fontFamily: "'Nanum Pen Script', cursive", fontSize: 60 * scale,
      color: stamp.color, lineHeight: 1, whiteSpace: 'nowrap',
      transform: 'rotate(-4deg)', userSelect: 'none',
    }}>{stamp.text}</div>;
  }
  if (stamp.kind === 'sign') {
    return <div style={{
      fontFamily: "'Dancing Script', cursive", fontWeight: 700, fontSize: 50 * scale,
      color: stamp.color, lineHeight: 1, whiteSpace: 'nowrap', userSelect: 'none',
    }}>{stamp.text}</div>;
  }
  return null;
}

/* editor.jsx — document editor: toolbar, stamp placement/manipulation, popups */
const { useState, useRef, useEffect } = React;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function ToolBtn({ name, label, onClick, active, primary, disabled, showLabel, badge }) {
  return (
    <button className={'toolbtn' + (active ? ' active' : '') + (primary ? ' primary' : '')}
      onClick={onClick} disabled={disabled} aria-label={label}>
      <span className="tb-ic"><Icon name={name} size={primary ? 23 : 21} sw={1.85} />
        {badge ? <em className="tb-badge">{badge}</em> : null}</span>
      {showLabel && <span className="toolbtn-label">{label}</span>}
    </button>
  );
}

function Sheet({ open, onClose, title, sub, children, footer, dialog }) {
  if (!open) return null;
  return (
    <div className={'sheet-scrim' + (dialog ? ' center' : '')} onClick={onClose}>
      <div className={dialog ? 'dialog' : 'sheet'} onClick={(e) => e.stopPropagation()}>
        {!dialog && <span className="sheet-grip" />}
        <div className="sheet-head">
          <div>
            <span className="sheet-title">{title}</span>
            {sub && <span className="sheet-sub">{sub}</span>}
          </div>
          <button className="iconbtn" onClick={onClose} aria-label="닫기"><Icon name="close" size={20} /></button>
        </div>
        <div className="sheet-body">{children}</div>
        {footer && <div className="sheet-foot">{footer}</div>}
      </div>
    </div>
  );
}

/* ───────── 도장 선택 팝업 (탭 · 검색 · 최근 · 크기/투명도) ───────── */
const KIND_TABS = [
  { k: 'all', t: '전체' }, { k: 'seal', t: '인감·도장' },
  { k: 'signature', t: '서명' }, { k: 'sign', t: '사인' }, { k: 'image', t: '업로드' },
];

function StampPopup({ open, onClose, library, recent, sealInk, defaults, onConfirm, onAddNew, popupStyle }) {
  const [sel, setSel] = useState(null);
  const [tab, setTab] = useState('all');
  const [q, setQ] = useState('');
  const [size, setSize] = useState(defaults.size);
  const [opacity, setOpacity] = useState(defaults.opacity);
  useEffect(() => {
    if (open) { setSel(null); setTab('all'); setQ(''); setSize(defaults.size); setOpacity(defaults.opacity); }
  }, [open]);
  if (!open) return null;

  const norm = (s) => (s || '').toLowerCase();
  const list = library.filter((s) => (tab === 'all' || s.kind === tab) && (!q || norm(s.label).includes(norm(q)) || norm(s.text).includes(norm(q))));
  const recentItems = recent.map((id) => library.find((s) => s.id === id)).filter(Boolean).slice(0, 4);
  const ink = (s) => ({ ...s, color: s.kind === 'seal' ? (s.color || sealInk) : s.color });
  const selStamp = library.find((s) => s.id === sel);

  const Card = ({ s, small }) => (
    <button className={'stamp-card' + (sel === s.id ? ' sel' : '') + (small ? ' small' : '')} onClick={() => setSel(s.id)}>
      <div className="stamp-card-art"><StampVisual stamp={ink(s)} scale={(s.kind === 'image' ? 0.85 : 0.58) * (small ? 0.8 : 1)} /></div>
      <span className="stamp-card-label">{s.label}</span>
      {sel === s.id && <span className="stamp-card-tick"><Icon name="check" size={13} sw={2.8} /></span>}
    </button>
  );

  return (
    <Sheet open={open} onClose={onClose} title="도장 · 서명 선택" sub={library.length + '개 보관 중'}
      dialog={popupStyle === 'dialog'}
      footer={
        <div className="pop-foot">
          <div className="pop-preview">
            {selStamp
              ? <span style={{ opacity }}><StampVisual stamp={ink(selStamp)} scale={0.34 * size} /></span>
              : <span className="muted">미선택</span>}
          </div>
          <div className="sheet-actions" style={{ flex: 1 }}>
            <button className="btn ghost" onClick={onClose}>취소</button>
            <button className="btn solid" disabled={!sel}
              onClick={() => { onConfirm(sel, { size, opacity }); onClose(); }}>확인</button>
          </div>
        </div>
      }>
      <div className="pop-search">
        <Icon name="zoom" size={17} color="var(--muted)" />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="도장 이름 검색" />
        {q && <button className="iconbtn sm" onClick={() => setQ('')}><Icon name="close" size={15} /></button>}
      </div>

      <div className="chips">
        {KIND_TABS.map((t) => (
          <button key={t.k} className={'chip' + (tab === t.k ? ' on' : '')} onClick={() => setTab(t.k)}>{t.t}</button>
        ))}
      </div>

      {tab === 'all' && !q && recentItems.length > 0 && (
        <div className="pop-block">
          <div className="pop-block-h">최근 사용</div>
          <div className="stamp-row">{recentItems.map((s) => <Card key={'r' + s.id} s={s} small />)}</div>
        </div>
      )}

      <div className="pop-block">
        <div className="pop-block-h">{tab === 'all' ? '전체 도장' : KIND_TABS.find((t) => t.k === tab).t}<em>{list.length}</em></div>
        {list.length ? (
          <div className="stamp-grid">
            {list.map((s) => <Card key={s.id} s={s} />)}
            <button className="stamp-card add" onClick={onAddNew}>
              <div className="stamp-card-art"><Icon name="plus" size={24} sw={2} /></div>
              <span className="stamp-card-label">새 도장</span>
            </button>
          </div>
        ) : (
          <div className="empty">
            <Icon name="stamp" size={26} color="#b9c1d0" />
            <span>해당하는 도장이 없습니다</span>
            <button className="btn ghost sm" onClick={onAddNew}>새로 등록</button>
          </div>
        )}
      </div>

      <div className="pop-block">
        <div className="pop-block-h">찍기 옵션</div>
        <div className="opt-row">
          <span className="opt-l">크기</span>
          <input className="rng" type="range" min="0.6" max="1.8" step="0.1" value={size} onChange={(e) => setSize(+e.target.value)} />
          <span className="opt-v">{Math.round(size * 100)}%</span>
        </div>
        <div className="opt-row">
          <span className="opt-l">투명도</span>
          <input className="rng" type="range" min="0.4" max="1" step="0.05" value={opacity} onChange={(e) => setOpacity(+e.target.value)} />
          <span className="opt-v">{Math.round(opacity * 100)}%</span>
        </div>
      </div>
    </Sheet>
  );
}

/* ───────── 새 도장 등록 ───────── */
function AddStampSheet({ open, onClose, sealInk, onAdd }) {
  const [tab, setTab] = useState('make');
  const [text, setText] = useState('');
  const fileRef = useRef(null);
  useEffect(() => { if (open) { setTab('make'); setText(''); } }, [open]);

  const addSeal = () => {
    const t = text.trim(); if (!t) return;
    onAdd({ id: makeId(), kind: 'seal', text: t.slice(0, 4), color: sealInk, label: '도장 · ' + t });
    onClose();
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { onAdd({ id: makeId(), kind: 'image', src: r.result, w: 120, label: '업로드 · ' + f.name.slice(0, 10) }); onClose(); };
    r.readAsDataURL(f);
  };
  return (
    <Sheet open={open} onClose={onClose} title="새 도장 등록" sub="기기에만 저장됩니다">
      <div className="seg">
        <button className={tab === 'make' ? 'on' : ''} onClick={() => setTab('make')}>이름으로 만들기</button>
        <button className={tab === 'up' ? 'on' : ''} onClick={() => setTab('up')}>촬영 · 업로드</button>
      </div>
      {tab === 'make' ? (
        <div className="add-make">
          <input className="tf" value={text} maxLength={4} placeholder="예) 김민수 (최대 4자)"
            onChange={(e) => setText(e.target.value)} />
          <div className="seal-preview">
            {text.trim() ? <SealVisual text={text.trim()} color={sealInk} size={92} /> : <span className="muted">미리보기</span>}
          </div>
          <button className="btn solid wide" disabled={!text.trim()} onClick={addSeal}>보관함에 등록</button>
        </div>
      ) : (
        <div className="add-up">
          <button className="upload-tile" onClick={() => fileRef.current && fileRef.current.click()}>
            <Icon name="camera" size={26} /><span>도장·서명을 촬영하거나<br />갤러리에서 가져오기</span>
          </button>
          <input ref={fileRef} type="file" accept="image/*" hidden onChange={onFile} />
          <ul className="tips">
            <li>흰 종이에 찍은 도장을 밝은 곳에서 촬영하세요.</li>
            <li>배경이 깨끗할수록 서류에 자연스럽게 겹쳐집니다.</li>
          </ul>
        </div>
      )}
    </Sheet>
  );
}

/* ───────────────────────── Editor ───────────────────────── */
function EditorScreen({ store }) {
  const { docMode, docImage, docName, setDocName, library, addStamp, recent, pushRecent,
    placed, setPlacedLive, pushHistory, undo, redo, canUndo, canRedo,
    goBack, openDrawer, nav, showToast, settings, t } = store;
  const sealInk = t.sealInk;

  const pageRef = useRef(null);
  const [zoom, setZoom] = useState(1);
  const [zoomBar, setZoomBar] = useState(false);
  const [popup, setPopup] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [share, setShare] = useState(false);
  const [preview, setPreview] = useState(false);
  const [menu, setMenu] = useState(false);
  const [prompt, setPrompt] = useState(null);       // 'rename' | 'saveas'
  const [confirm, setConfirm] = useState(null);      // {key,...}
  const [placing, setPlacing] = useState(null);
  const [ghost, setGhost] = useState(null);
  const [sel, setSel] = useState(null);
  const [ctx, setCtx] = useState(null);
  const [docRot, setDocRot] = useState(0);
  const dragRef = useRef(null);
  const lpRef = useRef(null);

  const stampById = (id) => library.find((s) => s.id === id);
  const pctFromEvent = (e) => {
    const r = pageRef.current.getBoundingClientRect();
    return { x: clamp(((e.clientX - r.left) / r.width) * 100, 0, 100), y: clamp(((e.clientY - r.top) / r.height) * 100, 0, 100) };
  };

  const beginPlacement = (stampId, opts) => {
    setPlacing({ ...stampById(stampId), _opts: opts }); setSel(null); pushRecent(stampId);
  };
  const endPlacement = () => { setPlacing(null); setGhost(null); };
  const onPageMove = (e) => { if (placing) setGhost(pctFromEvent(e)); };
  const onPageClick = (e) => {
    if (placing) {
      const p = pctFromEvent(e);
      pushHistory();
      const id = makeId();
      setPlacedLive((arr) => [...arr, { id, stampId: placing.id, x: p.x, y: p.y, scale: placing._opts.size, opacity: placing._opts.opacity, rot: 0 }]);
      if (settings.autoSelect) { setPlacing(null); setGhost(null); setSel(id); }
      return;
    }
    setSel(null);
  };

  const onHandleDown = (e, id, mode) => {
    e.stopPropagation(); e.preventDefault();
    const inst = placed.find((p) => p.id === id); if (!inst) return;
    const r = pageRef.current.getBoundingClientRect();
    const center = { x: r.left + (inst.x / 100) * r.width, y: r.top + (inst.y / 100) * r.height };
    pushHistory();
    dragRef.current = { id, mode, rect: r, center, startScale: inst.scale, startRot: inst.rot,
      startAngle: Math.atan2(e.clientY - center.y, e.clientX - center.x),
      startDist: Math.hypot(e.clientX - center.x, e.clientY - center.y) || 1 };
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragUp);
  };
  const onDragMove = (e) => {
    const d = dragRef.current; if (!d) return;
    const set = (fn) => setPlacedLive((arr) => arr.map((p) => p.id === d.id ? fn(p) : p));
    if (d.mode === 'move') {
      const x = clamp(((e.clientX - d.rect.left) / d.rect.width) * 100, 0, 100);
      const y = clamp(((e.clientY - d.rect.top) / d.rect.height) * 100, 0, 100);
      set((p) => ({ ...p, x, y }));
    } else if (d.mode === 'resize') {
      const dist = Math.hypot(e.clientX - d.center.x, e.clientY - d.center.y);
      set((p) => ({ ...p, scale: clamp(d.startScale * (dist / d.startDist), 0.4, 3.2) }));
    } else if (d.mode === 'rotate') {
      const ang = Math.atan2(e.clientY - d.center.y, e.clientX - d.center.x);
      set((p) => ({ ...p, rot: d.startRot + (ang - d.startAngle) * 180 / Math.PI }));
    }
  };
  const onDragUp = () => {
    dragRef.current = null;
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragUp);
  };

  const ctxAction = (k) => {
    if (!sel) return;
    pushHistory();
    if (k === 'del') { setPlacedLive((a) => a.filter((p) => p.id !== sel)); setSel(null); }
    if (k === 'dup') {
      const src = placed.find((p) => p.id === sel); if (!src) return;
      const id = makeId();
      setPlacedLive((a) => [...a, { ...src, id, x: clamp(src.x + 6, 0, 100), y: clamp(src.y + 6, 0, 100) }]);
      setSel(id);
    }
    if (k === 'front') {
      setPlacedLive((a) => { const i = a.findIndex((p) => p.id === sel); if (i < 0) return a; const c = [...a]; c.push(c.splice(i, 1)[0]); return c; });
    }
    if (k === 'reset') setPlacedLive((a) => a.map((p) => p.id === sel ? { ...p, rot: 0 } : p));
  };

  const onMenu = (k) => {
    if (k === 'rename') return setPrompt('rename');
    if (k === 'saveas') return setPrompt('saveas');
    if (k === 'pdf') return showToast('PDF로 변환하여 저장했습니다.');
    if (k === 'addpage') return showToast('페이지를 추가했습니다. (2/2)');
    if (k === 'rotate') { setDocRot((r) => (r + 90) % 360); return showToast('서류를 90° 회전했습니다.'); }
    if (k === 'replace') return showToast('서류 이미지를 다시 선택하세요.');
    if (k === 'manager') return nav('manager');
    if (k === 'settings') return nav('settings');
    if (k === 'clear') return setConfirm({ key: 'clear' });
  };

  const onShareAction = (k, fmt) => {
    const m = { kakao: '카카오톡으로 보냈습니다', message: '문자로 보냈습니다', mail: '메일로 보냈습니다',
      save: '기기에 저장했습니다', print: '인쇄 대화상자를 열었습니다', link: '공유 링크를 복사했습니다' };
    showToast((m[k] || '완료') + ' · ' + fmt);
  };

  const PAGE_W = 360;
  const renderPlaced = (p) => {
    const s = stampById(p.stampId); if (!s) return null;
    const stamp = { ...s, color: s.kind === 'seal' ? (s.color || sealInk) : s.color };
    const isSel = sel === p.id && !placing;
    const startLP = (e) => {
      if (placing) return;
      clearTimeout(lpRef.current);
      lpRef.current = setTimeout(() => { setSel(p.id); setCtx({ x: e.clientX - 20, y: e.clientY - 10 }); }, 520);
      if (isSel) onHandleDown(e, p.id, 'move');
    };
    return (
      <div key={p.id} className={'placed' + (isSel ? ' sel' : '')}
        style={{ left: p.x + '%', top: p.y + '%', opacity: p.opacity == null ? 1 : p.opacity,
          transform: `translate(-50%,-50%) rotate(${p.rot}deg)` }}
        onClick={(e) => { if (!placing) { e.stopPropagation(); setSel(p.id); } }}
        onContextMenu={(e) => { e.preventDefault(); setSel(p.id); setCtx({ x: e.clientX - 20, y: e.clientY - 10 }); }}
        onPointerDown={startLP}
        onPointerUp={() => clearTimeout(lpRef.current)}
        onPointerLeave={() => clearTimeout(lpRef.current)}>
        <StampVisual stamp={stamp} scale={p.scale} />
        {isSel && (
          <React.Fragment>
            <span className="h-del" onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); ctxAction('del'); }}><Icon name="close" size={13} sw={2.6} /></span>
            <span className="h-rot" onPointerDown={(e) => onHandleDown(e, p.id, 'rotate')}><Icon name="rotate" size={13} sw={2.2} /></span>
            <span className="h-res" onPointerDown={(e) => onHandleDown(e, p.id, 'resize')}><Icon name="resize" size={13} sw={2.2} /></span>
            <span className="h-mn" onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); setCtx({ x: e.clientX - 20, y: e.clientY - 10 }); }}><Icon name="more" size={13} sw={2.4} /></span>
          </React.Fragment>
        )}
      </div>
    );
  };

  return (
    <div className="editor">
      <div className="appbar">
        <button className="iconbtn" onClick={goBack} aria-label="뒤로"><Icon name="back" size={22} /></button>
        <div className="appbar-title">
          <span className="apptitle">{docName}</span>
          <span className="appsub">1 / 1 페이지 · 도장 {placed.length}개</span>
        </div>
        <button className="iconbtn" onClick={openDrawer} aria-label="전체 메뉴"><Icon name="menu" size={22} /></button>
        <button className="iconbtn" onClick={() => setMenu(true)} aria-label="더보기"><Icon name="more" size={22} /></button>
      </div>

      <div className="toolstrip">
        <ToolBtn name="stamp" label="도장" primary showLabel={t.toolLabels} onClick={() => setPopup(true)} />
        <span className="tool-div" />
        <ToolBtn name="undo" label="전단계" showLabel={t.toolLabels} disabled={!canUndo} onClick={undo} />
        <ToolBtn name="redo" label="다음단계" showLabel={t.toolLabels} disabled={!canRedo} onClick={redo} />
        <ToolBtn name="zoom" label="돋보기" showLabel={t.toolLabels} active={zoomBar} onClick={() => setZoomBar((v) => !v)} />
        <ToolBtn name="preview" label="미리보기" showLabel={t.toolLabels} onClick={() => setPreview(true)} />
        <ToolBtn name="save" label="저장" showLabel={t.toolLabels} onClick={() => setConfirm({ key: 'save' })} />
        <ToolBtn name="share" label="공유" showLabel={t.toolLabels} onClick={() => setShare(true)} />
      </div>

      {zoomBar && (
        <div className="zoombar">
          <button className="rbtn" onClick={() => setZoom((z) => clamp(+(z - 0.2).toFixed(2), 0.6, 2.6))}>−</button>
          <input className="rng" type="range" min="0.6" max="2.6" step="0.1" value={zoom} onChange={(e) => setZoom(+e.target.value)} />
          <button className="rbtn" onClick={() => setZoom((z) => clamp(+(z + 0.2).toFixed(2), 0.6, 2.6))}>+</button>
          <span className="zoom-val">{Math.round(zoom * 100)}%</span>
          <button className="btn ghost sm" onClick={() => setZoom(1)}>맞춤</button>
        </div>
      )}

      {placing && (
        <div className="place-banner">
          <span className="pb-art"><StampVisual stamp={{ ...placing, color: placing.kind === 'seal' ? (placing.color || sealInk) : placing.color }} scale={0.3} /></span>
          <span className="pb-text">원하는 위치를 탭하면 도장이 찍힙니다</span>
          <button className="btn solid sm" onClick={endPlacement}>완료</button>
        </div>
      )}

      <div className="canvas">
        <div className={'page-wrap' + (placing ? ' placing' : '')}>
          <div className="page" ref={pageRef} onMouseMove={onPageMove} onClick={onPageClick}
            style={{ width: PAGE_W * zoom, height: PAGE_W * 1.414 * zoom, rotate: docRot + 'deg' }}>
            {docMode === 'image' && docImage
              ? <img className="doc-img" src={docImage} alt="" draggable={false} />
              : <SampleCertificate />}
            {placed.map(renderPlaced)}
            {placing && ghost && (
              <div className="stamp-ghost" style={{ left: ghost.x + '%', top: ghost.y + '%', opacity: placing._opts.opacity * 0.75 }}>
                <StampVisual stamp={{ ...placing, color: placing.kind === 'seal' ? (placing.color || sealInk) : placing.color }} scale={placing._opts.size} />
              </div>
            )}
          </div>
        </div>
      </div>

      {sel && !placing && (
        <div className="selbar">
          <span className="sb-t">도장 선택됨</span>
          <button onClick={() => ctxAction('dup')}><Icon name="layers" size={17} />복제</button>
          <button onClick={() => ctxAction('reset')}><Icon name="rotate" size={17} />회전 초기화</button>
          <button className="danger" onClick={() => ctxAction('del')}><Icon name="trash" size={17} />삭제</button>
        </div>
      )}

      <StampPopup open={popup} onClose={() => setPopup(false)} library={library} recent={recent} sealInk={sealInk}
        defaults={settings} popupStyle={t.popupStyle} onAddNew={() => { setPopup(false); setAddOpen(true); }}
        onConfirm={beginPlacement} />
      <AddStampSheet open={addOpen} onClose={() => setAddOpen(false)} sealInk={sealInk}
        onAdd={(s) => { addStamp(s); showToast('도장이 보관함에 저장되었습니다.'); }} />
      <ShareSheet open={share} onClose={() => setShare(false)} docName={docName} defaults={settings} onAction={onShareAction} />
      <OverflowMenu open={menu} onClose={() => setMenu(false)} on={onMenu} placedCount={placed.length} />
      <StampContextMenu at={ctx} onClose={() => setCtx(null)} on={ctxAction} />
      <PromptDialog open={prompt === 'rename'} title="이름 변경" hint="서류 이름을 입력하세요." initial={docName}
        onClose={() => setPrompt(null)} onConfirm={(v) => { setDocName(v); showToast('이름을 변경했습니다.'); }} />
      <PromptDialog open={prompt === 'saveas'} title="다른 이름으로 저장" hint="사본으로 저장할 이름을 입력하세요."
        initial={docName + ' 사본'} onClose={() => setPrompt(null)}
        onConfirm={(v) => { setDocName(v); showToast('「' + v + '」(으)로 저장했습니다.'); }} />
      <ConfirmDialog open={confirm && confirm.key === 'save'} title="이 서류를 저장할까요?"
        body={'도장 ' + placed.length + '개가 합쳐져 ' + settings.format + '로 저장됩니다.'} confirmLabel="저장"
        onClose={() => setConfirm(null)} onConfirm={() => showToast('저장했습니다 · ' + settings.format)} />
      <ConfirmDialog open={confirm && confirm.key === 'clear'} title="찍은 도장을 모두 지울까요?" danger confirmLabel="모두 지우기"
        body="되돌리기(전단계)로 복구할 수 있습니다."
        onClose={() => setConfirm(null)} onConfirm={() => { pushHistory(); setPlacedLive([]); setSel(null); showToast('도장을 모두 지웠습니다.'); }} />
      <PreviewModal open={preview} onClose={() => setPreview(false)} docName={docName} fmt={settings.format}
        docMode={docMode} docImage={docImage} placed={placed} library={library} sealInk={sealInk}
        onShare={() => { setPreview(false); setShare(true); }} />
    </div>
  );
}

function PreviewModal({ open, onClose, docName, docMode, docImage, placed, library, sealInk, fmt, onShare }) {
  if (!open) return null;
  const PAGE_W = 340;
  return (
    <div className="preview-modal">
      <div className="preview-top">
        <span className="preview-name"><Icon name="preview" size={18} /> 미리보기</span>
        <button className="iconbtn" onClick={onClose} aria-label="닫기"><Icon name="close" size={22} /></button>
      </div>
      <div className="preview-scroll">
        <div className="page preview-page" style={{ width: PAGE_W, height: PAGE_W * 1.414 }}>
          {docMode === 'image' && docImage ? <img className="doc-img" src={docImage} alt="" /> : <SampleCertificate />}
          {placed.map((p) => {
            const s = library.find((x) => x.id === p.stampId); if (!s) return null;
            const stamp = { ...s, color: s.kind === 'seal' ? (s.color || sealInk) : s.color };
            return (
              <div key={p.id} className="placed" style={{ left: p.x + '%', top: p.y + '%', opacity: p.opacity == null ? 1 : p.opacity, transform: `translate(-50%,-50%) rotate(${p.rot}deg)` }}>
                <StampVisual stamp={stamp} scale={p.scale} />
              </div>
            );
          })}
        </div>
      </div>
      <div className="preview-bar">
        <div className="pv-meta"><b>{docName}.{fmt.toLowerCase()}</b><i>1 / 1 페이지 · 도장 {placed.length}개</i></div>
        <button className="btn solid" onClick={onShare}>공유</button>
      </div>
    </div>
  );
}

Object.assign(window, { EditorScreen, Sheet, AddStampSheet });

/* app.jsx — root: routing, shared state, settings, tweaks, mount */
const { useState: useS, useEffect: useE, useRef: useR } = React;

const THEMES = {
  navy:   { primary: '#2B6CE6', primaryDark: '#1E4FB0', navy: '#14233F', surface: '#F4F6FB', card: '#FFFFFF', line: '#E2E7F0', muted: '#5A6B86' },
  indigo: { primary: '#5046E5', primaryDark: '#3A32B5', navy: '#1B1740', surface: '#F5F4FC', card: '#FFFFFF', line: '#E6E4F4', muted: '#615C82' },
  teal:   { primary: '#0E8C86', primaryDark: '#0A6B66', navy: '#0C2E2C', surface: '#F1F8F6', card: '#FFFFFF', line: '#DCEAE6', muted: '#4E726C' },
};
const SEAL_INKS = { '주홍': '#D7402B', '진홍': '#C0182B', '남색': '#1A357A' };

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "navy",
  "popupStyle": "sheet",
  "toolLabels": true
}/*EDITMODE-END*/;

const DEFAULT_SETTINGS = {
  ink: '주홍', size: 1, opacity: 1, autoSelect: true,
  format: 'PDF', hq: false, autosave: true, pw: false, localOnly: true,
};

const LS_KEY = 'docstamp_v2';
const loadState = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } };
const saveState = (s) => { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {} };

function CaptureScreen({ onLoadSample, onLoadImage, openDrawer, theme }) {
  const fileRef = useR(null);
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => onLoadImage(r.result, f.name.replace(/\.[^.]+$/, '').slice(0, 20) || '업로드 서류');
    r.readAsDataURL(f);
  };
  return (
    <div className="capture">
      <div className="cap-top">
        <div className="cap-brand">
          <span className="cap-logo"><Icon name="stamp" size={24} color="#fff" /></span>
          <div>
            <div className="cap-app">도장 한 번</div>
            <div className="cap-tag">서류에 도장 찍어 바로 공유</div>
          </div>
        </div>
        <button className="iconbtn" onClick={openDrawer} aria-label="전체 메뉴"><Icon name="menu" size={22} /></button>
      </div>

      <div className="cap-hero">
        <div className="cap-hero-doc">
          <span className="chd-line w70" /><span className="chd-line w90" /><span className="chd-line w50" />
          <span className="chd-line w80" /><span className="chd-line w40" />
          <span className="chd-seal"><SealVisual text="확인" color="#D7402B" size={62} /></span>
        </div>
      </div>

      <div className="cap-headline">서류를 불러와 시작하세요</div>
      <p className="cap-desc">촬영하거나 갤러리에서 가져온 서류 위에<br />도장·서명을 찍어 인증서류를 만듭니다.</p>

      <div className="cap-actions">
        <button className="cap-btn primary" onClick={() => onLoadSample()}>
          <Icon name="camera" size={24} color="#fff" /><span>카메라로 촬영</span>
        </button>
        <button className="cap-btn" onClick={() => fileRef.current && fileRef.current.click()}>
          <Icon name="upload" size={24} /><span>갤러리에서 업로드</span>
        </button>
        <input ref={fileRef} type="file" accept="image/*" hidden onChange={onFile} />
      </div>

      <div className="cap-recent">
        <div className="cap-recent-h">최근 서류</div>
        <button className="recent-row" onClick={() => onLoadSample()}>
          <span className="recent-thumb"><Icon name="file" size={20} color={theme.primary} /></span>
          <span className="recent-meta"><b>재직증명서.jpg</b><i>오늘 · 도장 미적용</i></span>
          <Icon name="back" size={18} color={theme.muted} style={{ transform: 'scaleX(-1)' }} />
        </button>
      </div>
    </div>
  );
}

function HelpScreen({ onBack }) {
  const steps = [
    { ic: 'camera', t: '서류 불러오기', d: '카메라로 촬영하거나 갤러리에서 업로드합니다.' },
    { ic: 'stamp', t: '도장 선택', d: '상단 도장 버튼을 누르면 보관함이 팝업으로 열립니다.' },
    { ic: 'pen', t: '위치 지정', d: '확인을 누른 뒤 서류에서 원하는 지점을 탭하면 날인됩니다.' },
    { ic: 'share', t: '저장 · 공유', d: 'PDF·이미지로 저장하거나 카톡·문자·메일로 보냅니다.' },
  ];
  return (
    <div className="sub-screen">
      <div className="appbar">
        <button className="iconbtn" onClick={onBack} aria-label="뒤로"><Icon name="back" size={22} /></button>
        <div className="appbar-title"><span className="apptitle">이용 안내</span></div>
      </div>
      <div className="st-scroll">
        <div className="help-list">
          {steps.map((s, i) => (
            <div className="help-row" key={s.t}>
              <span className="help-n">{i + 1}</span>
              <div className="help-t"><b>{s.t}</b><i>{s.d}</i></div>
              <Icon name={s.ic} size={20} color="var(--primary)" />
            </div>
          ))}
        </div>
        <p className="help-note">도장·서명 이미지는 기기에만 저장되며 서버로 전송되지 않습니다.</p>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = THEMES[t.theme] || THEMES.navy;

  const init = loadState();
  const [screen, setScreen] = useS(init.screen || 'capture');
  const [docMode, setDocMode] = useS(init.docMode || 'sample');
  const [docImage, setDocImage] = useS(init.docImage || null);
  const [docName, setDocName] = useS(init.docName || '재직증명서');
  const [library, setLibrary] = useS(init.library || SAMPLE_LIBRARY);
  const [placed, setPlaced] = useS(init.placed || []);
  const [recent, setRecent] = useS(init.recent || []);
  const [favId, setFavId] = useS(init.favId || null);
  const [settings, setSettings] = useS({ ...DEFAULT_SETTINGS, ...(init.settings || {}) });
  const [drawer, setDrawer] = useS(false);
  const [addFromMenu, setAddFromMenu] = useS(false);
  const [past, setPast] = useS([]);
  const [future, setFuture] = useS([]);
  const [toast, setToast] = useS(null);
  const toastT = useR(null);

  const sealInk = SEAL_INKS[settings.ink] || SEAL_INKS['주홍'];

  useE(() => { saveState({ screen, docMode, docImage, docName, library, placed, recent, favId, settings }); },
    [screen, docMode, docImage, docName, library, placed, recent, favId, settings]);

  const showToast = (msg) => {
    setToast(msg); clearTimeout(toastT.current);
    toastT.current = setTimeout(() => setToast(null), 2200);
  };
  const setSetting = (k, v) => setSettings((s) => ({ ...s, [k]: v }));
  const pushHistory = () => { setPast((p) => [...p, placed]); setFuture([]); };
  const undo = () => { if (!past.length) return; const prev = past[past.length - 1]; setPast((p) => p.slice(0, -1)); setFuture((f) => [placed, ...f]); setPlaced(prev); };
  const redo = () => { if (!future.length) return; const nxt = future[0]; setFuture((f) => f.slice(1)); setPast((p) => [...p, placed]); setPlaced(nxt); };

  const loadSample = () => { setDocMode('sample'); setDocImage(null); setDocName('재직증명서'); setScreen('editor'); };
  const loadImage = (src, name) => { setDocMode('image'); setDocImage(src); setDocName(name); setScreen('editor'); };

  const store = {
    docMode, docImage, docName, setDocName,
    library, addStamp: (s) => setLibrary((l) => [...l, s]),
    recent, pushRecent: (id) => setRecent((r) => [id, ...r.filter((x) => x !== id)].slice(0, 6)),
    placed, setPlacedLive: setPlaced, pushHistory, undo, redo,
    canUndo: past.length > 0, canRedo: future.length > 0,
    goBack: () => setScreen('capture'),
    openDrawer: () => setDrawer(true),
    nav: (k) => setScreen(k),
    showToast, settings, t: { ...t, sealInk },
  };

  const vars = {
    '--primary': theme.primary, '--primary-dark': theme.primaryDark, '--navy': theme.navy,
    '--surface': theme.surface, '--card': theme.card, '--line': theme.line, '--muted': theme.muted,
    '--seal-ink': sealInk,
  };

  const body = () => {
    if (screen === 'capture') return <CaptureScreen onLoadSample={loadSample} onLoadImage={loadImage} openDrawer={() => setDrawer(true)} theme={theme} />;
    if (screen === 'settings') return <SettingsScreen settings={settings} setSetting={setSetting} onBack={() => setScreen('editor')} />;
    if (screen === 'manager') return (
      <StampManagerScreen library={library} favId={favId} onBack={() => setScreen('editor')}
        onAdd={() => setAddFromMenu(true)}
        onRemove={(id) => { setLibrary((l) => l.filter((s) => s.id !== id)); showToast('도장을 삭제했습니다.'); }}
        onRename={(id, label) => { setLibrary((l) => l.map((s) => s.id === id ? { ...s, label } : s)); showToast('이름을 변경했습니다.'); }}
        onFav={(id) => { setFavId(id); showToast('기본 도장으로 지정했습니다.'); }} />
    );
    if (screen === 'docs') return <DocsScreen onBack={() => setScreen('capture')} onOpen={() => setScreen('editor')} docName={docName} />;
    if (screen === 'help') return <HelpScreen onBack={() => setScreen('capture')} />;
    return <EditorScreen store={store} />;
  };

  return (
    <div className="stage">
      <div className="app-root" style={vars}>
        <AndroidDevice>
          <div className="device-fill">
            {body()}
            <Drawer open={drawer} onClose={() => setDrawer(false)} docName={docName}
              stampCount={library.length} placedCount={placed.length}
              onNav={(k) => setScreen(k)} />
            <AddStampSheet open={addFromMenu} onClose={() => setAddFromMenu(false)} sealInk={sealInk}
              onAdd={(s) => { setLibrary((l) => [...l, s]); showToast('도장이 보관함에 저장되었습니다.'); }} />
            {toast && <div className="toast"><Icon name="check" size={16} sw={2.6} color="#fff" />{toast}</div>}
          </div>
        </AndroidDevice>
      </div>

      <TweaksPanel>
        <TweakSection label="색상 테마" />
        <TweakColor label="UI 톤" value={theme.primary}
          options={[THEMES.navy.primary, THEMES.indigo.primary, THEMES.teal.primary]}
          onChange={(v) => setTweak('theme', v === THEMES.indigo.primary ? 'indigo' : v === THEMES.teal.primary ? 'teal' : 'navy')} />
        <TweakSection label="레이아웃" />
        <TweakRadio label="도장 팝업" value={t.popupStyle} options={['sheet', 'dialog']}
          onChange={(v) => setTweak('popupStyle', v)} />
        <TweakToggle label="툴바 라벨 표시" value={t.toolLabels} onChange={(v) => setTweak('toolLabels', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
